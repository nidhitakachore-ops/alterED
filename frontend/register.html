<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="style.css" rel="stylesheet"/>
  <script defer="" src="script.js">
  </script>
  <title>
   alterED | Register
  </title>
 </head>
 <body>
  <div class="student-page role-page auth-page" data-allowed-roles="student faculty admin">
   <header class="dashboard-navbar">
    <a aria-label="alterED home" class="brand" href="index.html">
     <img alt="alterED Logo" class="brand-logo" src="logo.jfif"/>
     <div class="brand-name">
      alter
      <span>
       ED
      </span>
     </div>
    </a>
    <nav aria-label="Primary navigation" class="dashboard-nav">
     <a class="nav-link" data-page="index.html" data-roles="student faculty admin" href="index.html">
      Home
     </a>
     <a class="nav-link" data-page="student.html" data-roles="student" href="student.html">
      Dashboard
     </a>
     <a class="nav-link" data-page="timetable.html" data-roles="student faculty admin" href="timetable.html">
      Timetable
     </a>
     <a class="nav-link" data-page="attendance.html" data-roles="student" href="attendance.html">
      Attendance
     </a>
     <a class="nav-link" data-page="notification.html" data-roles="student faculty admin" href="notification.html">
      Notifications
     </a>
     <a class="nav-link" data-page="exam.html" data-roles="student faculty admin" href="exam.html">
      Exams
     </a>
     <a class="nav-link" data-page="faculty.html" data-roles="faculty admin" href="faculty.html">
      Faculty
     </a>
     <a class="nav-link" data-page="admin.html" data-roles="admin" href="admin.html">
      Admin
     </a>
     <a class="nav-link" data-page="about.html" data-roles="student faculty admin" href="about.html">
      About
     </a>
    </nav>
    <div class="student-profile">
     <div aria-hidden="true" class="profile-circle">
      ♙
     </div>
     <div class="profile-info">
      <strong id="profileRole">
       Student
      </strong>
      <span id="profileScope">
       Student Portal
      </span>
     </div>
     <button aria-label="Logout" class="logout-button" id="logoutButton" type="button">
      Logout
     </button>
    </div>
   </header>
   <main class="page-shell">
    <div class="data-card form-card">
     <span class="section-label">
      NEW ACCOUNT
     </span>
     <h1 class="page-title" style="font-size:38px">
      Create
      <span>
       Account
      </span>
     </h1>
     <form id="registerForm">
      <div class="auth-input">
       <span>
        ♙
       </span>
       <input placeholder="Full name" required="" type="text"/>
      </div>
      <div class="auth-input">
       <span>
        ✉
       </span>
       <input placeholder="Email address" required="" type="email"/>
      </div>
      <div class="auth-input">
       <span>
        ⌑
       </span>
       <input placeholder="Password" required="" type="password"/>
      </div>
      <button class="auth-submit" type="submit">
       Register
      </button>
      <p class="notice" id="registerMessage">
      </p>
     </form>
     <a class="secondary-button" href="login.html">
      Back to Login
     </a>
    </div>
   </main>
   <footer class="dashboard-footer">
    ✦ alterED — Smart. Connected. Efficient.
   </footer>
  </div>
 </body>
</html>
