<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alterED | Register Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="home.html" class="brand">
        <img src="images/test 2.jpg" class="brand-logo" alt="alterED Logo">
        <div class="brand-name">alter<span>ED</span></div>
    </a>

    <nav class="nav-menu" id="navMenu">
        <a href="home.html">Home</a>
        <a href="timetable.html">Timetable</a>
        <a href="attendance.html">Attendance</a>
        <a href="faculty.html">Faculty</a>
        <a href="student.html">Student</a>
        <a href="admin.html">Admin</a>
    </nav>

    <a href="login.html" class="auth-nav-button">
        <span class="user-icon">◉</span>
        Logout
    </a>

    <button class="menu-button" id="menuButton" type="button">☰</button>

</header>


<main class="auth-page">

    <div class="auth-background-glow glow-auth-one"></div>
    <div class="auth-background-glow glow-auth-two"></div>


    <section class="auth-container">

        <div class="auth-column">

            <div class="auth-heading">
                <h1>Register Student</h1>
                <p>Create a new student record</p>
            </div>


            <form id="registerForm">

                <div class="auth-input">
                    <span>👤</span>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Student Name"
                        required
                    >
                </div>


                <div class="auth-input">
                    <span>✉</span>
                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Email Address"
                        required
                    >
                </div>


                <div class="auth-input">
                    <span>🎓</span>
                    <input
                        type="text"
                        id="studentCourse"
                        placeholder="Course / Department"
                        required
                    >
                </div>


                <div class="auth-input">
                    <span>🔢</span>
                    <input
                        type="text"
                        id="studentRoll"
                        placeholder="Roll Number"
                        required
                    >
                </div>


                <button class="auth-submit" type="submit">
                    Register Student
                </button>

                <div class="form-message" id="formMessage"></div>

            </form>

        </div>


        <div class="auth-divider"></div>


        <div class="auth-column">

            <div class="auth-heading">
                <h1>alterED</h1>
                <p>Student Information System</p>
            </div>

            <p class="simple-description">
                Registering a student allows the academic
                system to maintain timetable, attendance
                and faculty-related information.
            </p>

        </div>

    </section>

</main>


<script>

    const menuButton = document.getElementById("menuButton");
    const navMenu = document.getElementById("navMenu");

    menuButton.addEventListener("click", () => {
        navMenu.classList.toggle("show");
    });


    const registerForm =
        document.getElementById("registerForm");

    const formMessage =
        document.getElementById("formMessage");


    registerForm.addEventListener("submit", function(event) {

        event.preventDefault();

        formMessage.textContent =
            "Student registration form submitted successfully.";

        registerForm.reset();

    });

</script>

</body>
</html>
